version: 0.1.0
author: forefy
language: solidity
accent: ""
name: Unprotected Configuration Setters
description: Public or external configuration setters should enforce access control before allowing sensitive protocol updates.
severity: High
certainty: Low
rule: |
  suspicious_names = {
      "setFee",
      "setOracle",
      "setPool",
      "setOwner",
      "setAdmin",
      "setTreasury",
      "setRouter",
  }
  # Any modifier whose name carries an access-control keyword counts as protection.
  # This generalizes past a fixed list to custom RBAC (onlyOwnerRole, onlyProtocolConfig,
  # onlyManager, requiresAuth, ...) commonly used in real protocols.
  access_keywords = ("owner", "admin", "role", "gov", "auth", "manager", "operator", "config", "guardian", "restrict", "permission", "proxy")

  def modifier_names(func):
      names = []
      def recurse(node):
          try:
              if (node.access_path or "").endswith("modifierName"):
                  name = node.metadata.get("name")
                  if name:
                      names.append(name)
              for child in node.children:
                  recurse(child)
          except:
              pass
      recurse(func)
      return names

  for source, nodes in ast:
    try:
        functions = nodes.find_all_functions().exit_on_none()
        for function in functions:
            try:
                function_name = function.metadata.get("name", "")
                if function_name not in suspicious_names:
                    continue
                if function.metadata.get("visibility") not in ("public", "external"):
                    continue
                access_controlled = False
                for modifier_name in modifier_names(function):
                    lowered = modifier_name.lower()
                    for keyword in access_keywords:
                        if keyword in lowered:
                            access_controlled = True
                            break
                    if access_controlled:
                        break
                if access_controlled:
                    continue

                protected_by_require = False
                require_calls = function.find_nodes_by_names("require")
                for require_call in require_calls:
                    require_scope = require_call.parent
                    if len(require_scope.find_nodes_by_member_names("sender")) > 0 and len(require_scope.find_nodes_by_names("owner", "admin")) > 0:
                        protected_by_require = True
                        break

                if not protected_by_require:
                    print(function.to_result())
            except:
                continue
    except:
        continue
