version: 0.1.1
author: forefy
accent: stylus
name: Off By One Comparison
description: Gating the success path of a bound check on a strict comparison against an inclusive boundary (max, limit, cap, threshold) rejects the boundary value itself. `amount < max` accepts one unit less than intended where `amount <= max` is meant.
severity: Low
certainty: Low
vulnerable_example: https://github.com/Auditware/radar/blob/main/api/tests/mocks/off_by_one_comparison/bad/src/lib.rs#L18
rule: |
  boundary_words = ("max", "maximum", "min", "minimum", "limit", "cap", "threshold", "quota", "ceiling")
  for source, nodes in ast:
      try:
          funcs = nodes.find_all_functions().exit_on_none()
          for func in funcs:
              try:
                  if ".impl." not in (func.access_path or ""):
                      continue

                  # Operators reach the DSL as their source text ("<", "<="),
                  # not as syn variant names, and only the strict forms can be
                  # off by one against an inclusive bound.
                  for comparison in func.find_binary_operations("<", ">"):
                      comparison_path = comparison.access_path or ""
                      if not comparison_path.endswith(".binary"):
                          continue

                      # Only a guard decides acceptance - a loop bound or a
                      # plain expression comparison is not this bug.
                      cond_index = comparison_path.rfind(".if.cond.")
                      if cond_index == -1:
                          continue

                      # One side has to name an inclusive boundary. Matching on
                      # snake_case parts keeps "min" out of "mint".
                      bounded = False
                      for operand in comparison.find_by_access_path(comparison_path + "."):
                          for part in (operand.ident or "").lower().split("_"):
                              for word in boundary_words:
                                  if part == word:
                                      bounded = True
                      if not bounded:
                          continue

                      # The strict comparison must be what lets the caller
                      # through. `if amount > max { Err }` is the correct
                      # inclusive check and rejects nothing it should accept.
                      then_prefix = comparison_path[:cond_index] + ".if.then_branch"
                      accepts = False
                      for ok in func.find_by_names("Ok"):
                          if (ok.access_path or "").startswith(then_prefix):
                              accepts = True
                      if not accepts:
                          continue

                      print(comparison.to_result())
              except:
                  continue
      except:
          continue
