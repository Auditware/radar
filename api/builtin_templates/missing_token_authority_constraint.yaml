version: 0.1.1
author: forefy
accent: anchor
name: Missing Token Authority Constraint
description: TokenAccount fields in Anchor account structs without a token::authority constraint allow callers to pass token accounts they do not own, bypassing ownership verification.
severity: High
certainty: Medium
rule: |
  for source, nodes in ast:
      try:
          nodes.find_by_names("TokenAccount").exit_on_none()
          nodes.find_chained_calls("derive", "Accounts").exit_on_none()
          nodes.find_by_names("Signer").exit_on_none()
          nodes.find_by_names("transfer").exit_on_none()
          flagged_fields = set()
          for from_node in nodes.find_by_names("from"):
              try:
                  if ".fn." not in from_node.access_path:
                      continue
                  if ".struct.fields[" not in from_node.access_path:
                      continue
                  from_field_name = None
                  for candidate in from_node.find_by_access_path(".expr.method_call.receiver.field"):
                      if ".base.field" in candidate.access_path:
                          continue
                      from_field_name = candidate.ident
                      break
                  if from_field_name is None:
                      continue
                  transfer_prefix = from_node.access_path.split(".struct.fields[")[0]
                  authority_field_name = None
                  for candidate in nodes.find_by_names("authority"):
                      if not candidate.access_path.startswith(transfer_prefix + ".struct.fields["):
                          continue
                      if ".expr.method_call.receiver.field" not in candidate.access_path:
                          continue
                      if ".base.field" in candidate.access_path:
                          continue
                      authority_field_name = candidate.ident
                      break
                  if authority_field_name is None:
                      continue
                  function_prefix = transfer_prefix.split(".stmts[")[0]

                  # A token::authority constraint is the Anchor way, but a
                  # handler that checks the authority itself (require_keys_eq,
                  # or a comparison against the authority) is equally safe.
                  # Scoped to this handler so one instruction's check does not
                  # excuse another's missing constraint.
                  manually_validated = False
                  for check in nodes.find_by_names("require_keys_eq", "require_eq"):
                      if check.access_path.startswith(function_prefix + "."):
                          manually_validated = True
                          break
                  if not manually_validated:
                      for comparison in nodes.find_comparison_involving(authority_field_name):
                          if comparison.access_path.startswith(function_prefix + "."):
                              manually_validated = True
                              break
                  if manually_validated:
                      continue

                  context_node = None
                  for candidate in nodes.find_by_names("Context"):
                      if candidate.access_path.startswith(function_prefix + ".inputs["):
                          context_node = candidate
                          break
                  if context_node is None:
                      continue
                  accounts_struct_name = None
                  for candidate in context_node.find_by_access_path(".arguments.angle_bracketed.args[0].type.path.segments[0]"):
                      accounts_struct_name = candidate.ident
                      break
                  if accounts_struct_name is None:
                      continue
                  accounts_struct = None
                  for candidate in nodes.find_by_names(accounts_struct_name):
                      if candidate.access_path.endswith(".struct"):
                          accounts_struct = candidate
                          break
                  if accounts_struct is None:
                      continue
                  accounts_struct.find_chained_calls("derive", "Accounts").exit_on_none()
                  signer_found = False
                  for candidate in nodes.find_by_names(authority_field_name):
                      if not candidate.access_path.startswith(accounts_struct.access_path + ".fields.named["):
                          continue
                      if ".attrs[" in candidate.access_path:
                          continue
                      try:
                          candidate.find_by_names("Signer").exit_on_none()
                          signer_found = True
                          break
                      except:
                          continue
                  if not signer_found:
                      continue
                  field_node = None
                  for candidate in nodes.find_by_names(from_field_name):
                      if candidate.access_path.startswith(accounts_struct.access_path + ".fields.named["):
                          field_node = candidate
                          break
                  if field_node is None:
                      continue
                  field_node.find_by_names("TokenAccount").exit_on_none()
                  field_node.find_macro_attribute_by_names("token").exit_on_none()
                  field_node.find_macro_attribute_by_names("authority").exit_on_none()
              except:
                  if field_node is None:
                      continue
                  if field_node.access_path in flagged_fields:
                      continue
                  flagged_fields.add(field_node.access_path)
                  print(field_node.find_by_names("Account").first().to_result())
      except:
          continue
