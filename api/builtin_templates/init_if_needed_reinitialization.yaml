version: 0.1.1
author: forefy
accent: anchor
name: Init If Needed Reinitialization
description: Anchor accounts declared with init_if_needed can be reinitialized on a subsequent call, so the handler must guard against re-init (for example an is_initialized flag) to prevent an attacker from resetting existing account state.
severity: High
certainty: Medium
rule: |
  for source, nodes in ast:
      try:
          init_nodes = nodes.find_macro_attribute_by_names("init_if_needed").exit_on_none()
          guards = nodes.find_by_names("is_initialized", "initialized")
          contexts = nodes.find_by_names("Context")

          for init_node in init_nodes:
              # The struct carrying init_if_needed, and the handler that takes
              # it. Searching the whole file let a guard belonging to one
              # instruction excuse an unguarded init_if_needed in another.
              struct_path = init_node.access_path.split(".fields")[0]
              if not struct_path.endswith(".struct"):
                  continue

              struct_name = None
              for candidate in nodes.find_by_access_path(struct_path + ".ident"):
                  struct_name = candidate.ident
                  break
              if struct_name is None:
                  for candidate in nodes.find_by_access_path(""):
                      if candidate.access_path == struct_path:
                          struct_name = candidate.ident
                          break

              handler_prefixes = []
              for context in contexts:
                  if ".inputs[" not in context.access_path:
                      continue
                  for arg in context.find_by_access_path(".arguments.angle_bracketed.args[0]"):
                      if struct_name is not None and arg.ident == struct_name:
                          handler_prefixes.append(context.access_path.split(".inputs[")[0])
                      break

              guarded = False
              for guard in guards:
                  if not handler_prefixes:
                      guarded = True
                      break
                  for prefix in handler_prefixes:
                      if guard.access_path.startswith(prefix):
                          guarded = True
                          break
                  if guarded:
                      break
              if guarded:
                  continue

              print(init_node.to_result())
      except:
          continue
