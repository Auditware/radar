version: 0.1.1
author: forefy
accent: stylus
name: Unused Function Parameters
description: Unused function parameters indicate incomplete implementation or logic errors.
severity: Low
certainty: Low
vulnerable_example: https://github.com/Auditware/radar/blob/main/api/tests/mocks/unused_function_parameters/bad/src/lib.rs#L14
rule: |
  for source, nodes in ast:
    try:
      funcs = nodes.find_all_functions().exit_on_none()
      for func in funcs:
        access_path = func.access_path or ""
        if ".impl." not in access_path:
          continue

        # Declared parameter names live at <fn>.inputs[N].typed.pat.ident - the
        # sibling inputs[N].typed.ty... nodes are the *types*, not the names.
        # Anchoring on the fn's own access path keeps closure parameters out.
        inputs_prefix = access_path + ".inputs["
        for param in func.find_by_access_path(".typed.pat.ident").nodes:
          param_path = param.access_path or ""
          if not param_path.startswith(inputs_prefix):
            continue
          if not param_path.endswith(".typed.pat.ident"):
            continue

          param_name = param.ident
          if not param_name or param_name == "self":
            continue
          # A leading underscore is the Rust way of saying "unused on purpose".
          if param_name.startswith("_"):
            continue

          # The declaration itself is one hit; anything more means it is read.
          usage = func.find_by_names(param_name)
          if len(usage.nodes) <= 1:
            print(param.to_result())
    except:
      continue
