version: 0.2.0
author: forefy
accent: anchor
name: PDA Sharing
description: Reuse of a PDA across multiple authority domains can lead to unauthorized data or funds access.
severity: Low
certainty: Low
vulnerable_example: https://github.com/Auditware/radar/blob/main/api/tests/mocks/pda_sharing/bad/src/lib.rs
rule: |
  for source, nodes in ast:
      try:
          # PDA sharing is a risk only when the program signs a CPI with a PDA.
          # A transfer whose authority is a plain Signer (CpiContext::new) has no
          # PDA to reuse, so it carries no PDA-sharing risk.
          nodes.find_by_names("with_signer", "new_with_signer").exit_on_none()

          transfer_nodes = nodes.find_chained_calls("transfer").exit_on_none()
          seed_attrs = nodes.find_macro_attribute_by_names("seeds", "bump")

          groups = nodes.find_chained_calls("derive", "Accounts")
          struct_paths = []
          for group in groups:
              for derive_node in group:
                  path = derive_node.access_path.split(".attrs")[0]
                  if path.endswith(".struct") and path not in struct_paths:
                      struct_paths.append(path)

          # A signing PDA is narrowed by its seeds. Ask whether any accounts
          # struct in this file actually carries them, per struct, rather than
          # letting one seeded account elsewhere in the file stand in for all
          # of them.
          seeded = []
          for struct_path in struct_paths:
              for attr in seed_attrs:
                  if attr.access_path.startswith(struct_path + "."):
                      seeded.append(struct_path)
                      break

          if len(struct_paths) and len(seeded) == len(struct_paths):
              continue

          # When the signing seeds are built inline (not via `#[account(seeds)]`),
          # the PDA is safe only if its seed is tied to a specific account. A
          # `has_one` constraint binds a field to one counterpart, so a seed
          # derived from a has_one-bound field cannot be reused across domains.
          # The canonical bug derives the seed from a shared field (e.g. `mint`)
          # that no has_one covers.
          has_one_fields = set()
          for has_one in nodes.find_macro_attribute_by_names("has_one"):
              siblings = has_one.parent.children
              for index in range(len(siblings)):
                  if siblings[index].access_path == has_one.access_path and index + 1 < len(siblings):
                      has_one_fields.add(siblings[index + 1].ident)
                      break

          seed_fields = set()
          for as_ref in nodes.find_by_names("as_ref"):
              if as_ref.children:
                  seed_fields.add(as_ref.children[0].ident)

          if seed_fields and seed_fields.issubset(has_one_fields):
              continue

          for transfer_node in transfer_nodes:
              print(transfer_node.first().to_result())
      except:
          continue
