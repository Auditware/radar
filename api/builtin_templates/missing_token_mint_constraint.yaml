version: 0.1.4
author: forefy
accent: anchor
name: Missing Token Mint Constraint
description: Anchor account structs that accept TokenAccount fields without token::mint constraints can allow wrong-mint token accounts to be passed into sensitive flows.
severity: Medium
certainty: Low
rule: |
  for source, nodes in ast:
      try:
          nodes.find_by_names("TokenAccount").exit_on_none()
          flagged_structs = set()
          for token_account_node in nodes.find_by_names("TokenAccount"):
              try:
                  if ".struct.fields.named[" not in token_account_node.access_path:
                      continue
                  account_node = token_account_node.parent
                  field_node = account_node.parent
                  struct_node = field_node.parent
                  struct_node.find_chained_calls("derive", "Accounts").exit_on_none()

                  # A token::mint constraint is the Anchor way, but a handler
                  # that checks the mint itself (require_keys_eq, or a
                  # comparison against the mint) is equally safe. Scoped to the
                  # struct and the handlers that take it, so one instruction's
                  # check does not excuse another's missing constraint.
                  scopes = [struct_node.access_path]
                  for context in nodes.find_by_names("Context"):
                      if ".inputs[" not in context.access_path:
                          continue
                      for arg in context.find_by_access_path(".arguments.angle_bracketed.args[0]"):
                          if arg.ident == struct_node.ident:
                              scopes.append(context.access_path.split(".inputs[")[0])
                          break
                  manually_validated = False
                  for check in nodes.find_by_names("require_keys_eq", "require_eq"):
                      for scope in scopes:
                          if check.access_path.startswith(scope + "."):
                              manually_validated = True
                              break
                      if manually_validated:
                          break
                  if not manually_validated:
                      for comparison in nodes.find_comparison_involving("mint"):
                          for scope in scopes:
                              if comparison.access_path.startswith(scope + "."):
                                  manually_validated = True
                                  break
                          if manually_validated:
                              break
                  if manually_validated:
                      continue

                  # A wrong-mint account is only harmful if the program records
                  # something based on it. Where the program keeps no state of
                  # its own, substituting a mint changes at most what the caller
                  # sees about their own tokens - SPL Token still enforces that
                  # a transfer is authorised by the account's owner or delegate.
                  # Require a program state account (`#[account] struct ...`,
                  # which appears as a bare `.meta.path` attribute rather than a
                  # field-level `#[account(...)]` list).
                  # (`continue`, not exit_on_none: in this rule the except block
                  # is the reporting path, so raising here would report.)
                  has_program_state = False
                  for attr in nodes.find_by_names("account"):
                      if ".struct.attrs" in attr.access_path and ".meta.path." in attr.access_path:
                          has_program_state = True
                          break
                  if not has_program_state:
                      continue

                  # A token account already pinned to one specific account
                  # cannot be swapped for a wrong-mint one, so the mint
                  # constraint adds nothing. Pinning takes three forms:
                  #   * has_one/seeds/address on the field itself
                  #   * an inline constraint on the field
                  #   * a SIBLING account's `has_one = <this field>`, which
                  #     Anchor lowers to `sibling.<field> == <field>.key()` and
                  #     which pins it to an exact pubkey - strictly stronger
                  #     than pinning its mint.
                  pinned = False
                  for pin in nodes.find_macro_attribute_by_names("seeds", "address", "constraint", "has_one"):
                      if pin.access_path.startswith(field_node.access_path + "."):
                          pinned = True
                          break
                  if not pinned:
                      for has_one in nodes.find_macro_attribute_by_names("has_one"):
                          if not has_one.access_path.startswith(struct_node.access_path + "."):
                              continue
                          siblings = has_one.parent.children
                          for index in range(len(siblings)):
                              if siblings[index].access_path == has_one.access_path:
                                  if index + 1 < len(siblings) and siblings[index + 1].ident == field_node.ident:
                                      pinned = True
                                  break
                          if pinned:
                              break
                  if pinned:
                      continue

                  field_node.find_macro_attribute_by_names("token").exit_on_none()
                  field_node.find_macro_attribute_by_names("mint").exit_on_none()
              except:
                  if struct_node.access_path in flagged_structs:
                      continue
                  flagged_structs.add(struct_node.access_path)
                  print(account_node.to_result())
      except:
          continue
