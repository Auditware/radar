version: 0.1.4
author: forefy
accent: anchor
name: Missing has_one Constraint
description: An account holding an authority Pubkey should be tied to the signer that claims it, either with a has_one constraint or an explicit key comparison. Without one, any signer can act on another account's behalf.
severity: Low
certainty: Low
vulnerable_example: https://github.com/Auditware/radar/blob/main/api/tests/mocks/missing_has_one_constraint/bad/src/lib.rs
rule: |
  for source, nodes in ast:
      try:
          groups = nodes.find_chained_calls("derive", "Accounts").exit_on_none()
          signer_nodes = nodes.find_by_names("Signer").exit_on_none()
          pubkey_nodes = nodes.find_by_names("Pubkey").exit_on_none()
          has_one_nodes = nodes.find_macro_attribute_by_names("has_one")

          reported = []
          for group in groups:
              for derive_node in group:
                  struct_path = derive_node.access_path.split(".attrs")[0]
                  if not struct_path.endswith(".struct"):
                      continue
                  if struct_path in reported:
                      continue

                  # Scope to this struct. A has_one anywhere in the file used
                  # to vouch for every struct in it.
                  constrained = False
                  for has_one in has_one_nodes:
                      if has_one.access_path.startswith(struct_path + "."):
                          constrained = True
                          break
                  if constrained:
                      continue

                  # `has_one` is a constraint on a typed Anchor account
                  # (`Account<'info, T>` / `AccountLoader<'info, T>`); it cannot
                  # be written on a raw `AccountInfo`/`UncheckedAccount`. When a
                  # struct carries no typed account there is no field a has_one
                  # could bind to, so a "missing has_one" is not expressible
                  # there - the authority-holding data is reached by hand-rolled
                  # deserialization, which the owner-check rules cover instead.
                  # Without this the rule fired on manual-init handlers that keep
                  # their state in an AccountInfo (e.g. the sealevel
                  # reinitialization `secure` variant, which stores its authority
                  # in a raw account and *assigns* it from the signer rather than
                  # verifying it), reporting a constraint that could not apply.
                  typed_account = False
                  for typed in nodes.find_by_names("Account", "AccountLoader"):
                      if typed.access_path.startswith(struct_path + ".fields.named["):
                          typed_account = True
                          break
                  if not typed_account:
                      continue

                  # An `#[account(init)]` account is being created, so there is
                  # no stored authority yet for a has_one to bind against. Skip
                  # only when EVERY account in the struct is being initialised -
                  # if any pre-existing account is present it still needs the
                  # constraint, so a struct-wide skip would suppress a real
                  # finding (the same over-broad scoping this rule set has been
                  # removing elsewhere).
                  init_attrs = nodes.find_macro_attribute_by_names("init", "init_if_needed")
                  has_preexisting_account = False
                  for account in nodes.find_by_names("Account"):
                      if not account.access_path.startswith(struct_path + ".fields.named["):
                          continue
                      field_path = account.access_path.split(".ty")[0]
                      is_init = False
                      for init_attr in init_attrs:
                          if init_attr.access_path.startswith(field_path + "."):
                              is_init = True
                              break
                      if not is_init:
                          has_preexisting_account = True
                          break
                  if init_attrs.nodes and not has_preexisting_account:
                      continue

                  found_missing_has_one = False
                  for signer_node in signer_nodes:
                      if not signer_node.access_path.startswith(struct_path + "."):
                          continue
                      authority_name = signer_node.parent.ident
                      if authority_name not in ("authority", "owner", "admin"):
                          continue

                      # The binding may be written by hand instead of declared:
                      # `if stored.authority != ctx.accounts.authority.key() {
                      # return Err(..) }` enforces exactly what has_one would.
                      # This rule's own description accepts that form, so an
                      # explicit key comparison on the field counts as satisfied.
                      # `has_one` is not even expressible on a raw AccountInfo,
                      # which is precisely when the manual check gets written.
                      if nodes.find_comparison_involving(authority_name).nodes:
                          continue

                      for pubkey_node in pubkey_nodes:
                          if pubkey_node.parent.ident == authority_name:
                              found_missing_has_one = True
                              break
                      if found_missing_has_one:
                          break

                  if found_missing_has_one:
                      reported.append(struct_path)
                      print(derive_node.to_result())
      except:
          continue
