version: 0.1.1
author: forefy
accent: anchor
name: Account Reinitialization
description: When account initialization is not properly validated against reinitialization attempts, callers of the program may try to reinitialize an existing account to manipulate its data and state.
severity: High
certainty: High
vulnerable_example: https://github.com/Auditware/radar/blob/main/api/tests/mocks/account_reinitialization/bad/src/lib.rs#L9-L14
rule: |
  for source, nodes in ast:
      try:
          init_funcs = nodes.find_functions_by_names("initialize", "init").exit_on_none()
          # An already-initialized guard reads a flag and then sets it, so the
          # flag name appears at least twice; a handler that only assigns it
          # (the bug) mentions it once. `discriminator`/`is_initialized`/
          # `is_init` are the common flag names alongside `initialized`.
          guard_signals = init_funcs.find_by_names(
              "require", "initialized", "discriminator", "is_initialized", "is_init"
          )
          if len(guard_signals) >= 2:
              continue
          for func in init_funcs:
              print(func.to_result())
      except:
          continue




          