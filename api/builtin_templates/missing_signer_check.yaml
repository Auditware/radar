version: 0.1.3
author: forefy
accent: anchor
name: Missing Signer Check
description: When an instruction does not verify that a caller signed the transaction, any account may be passed in its place. Anchor proves this with a Signer field, or the handler can check is_signer directly.
severity: Low
certainty: Low
vulnerable_example: https://github.com/Auditware/radar/blob/main/api/tests/mocks/missing_signer_check/bad/src/lib.rs#L10
rule: |
  for source, nodes in ast:
      try:
          groups = nodes.find_chained_calls("derive", "Accounts").exit_on_none()

          signers = nodes.find_by_names("Signer")
          # An is_signer check lives in the handler, not the accounts struct.
          # Collect them once, then attribute each to the handler it sits in so
          # a manual check in one instruction does not excuse another.
          is_signer_nodes = []
          for node in nodes.find_comparison_involving("is_signer"):
              is_signer_nodes.append(node)
          for node in nodes.find_member_accesses("is_signer"):
              is_signer_nodes.append(node)

          reported = []
          for group in groups:
              for derive_node in group:
                  struct_path = derive_node.access_path.split(".attrs")[0]
                  if not struct_path.endswith(".struct"):
                      continue
                  if struct_path in reported:
                      continue

                  # Scope to this struct. Searching the file meant a single
                  # Signer field anywhere disabled the check for every other
                  # instruction defined beside it.
                  signed = False
                  for signer in signers:
                      if signer.access_path.startswith(struct_path + "."):
                          signed = True
                          break
                  if signed:
                      continue

                  # The struct itself, plus every handler whose Context<T>
                  # names it, so an is_signer check is credited only to the
                  # instruction that performs it.
                  struct_name = None
                  for candidate in nodes.find_by_access_path(struct_path):
                      if candidate.access_path == struct_path:
                          struct_name = candidate.ident
                          break
                  scopes = [struct_path]
                  if struct_name is not None:
                      for context in nodes.find_by_names("Context"):
                          if ".inputs[" not in context.access_path:
                              continue
                          for arg in context.find_by_access_path(".arguments.angle_bracketed.args[0]"):
                              if arg.ident == struct_name:
                                  scopes.append(context.access_path.split(".inputs[")[0])
                              break
                  checked = False
                  for node in is_signer_nodes:
                      for scope in scopes:
                          if node.access_path.startswith(scope + "."):
                              checked = True
                              break
                      if checked:
                          break
                  if checked:
                      continue

                  # A missing signer only matters where authority is actually
                  # claimed: a raw account standing in for a caller
                  # (authority/owner/admin/user/payer). A struct of PDA-derived
                  # data, sysvars, or a lamport destination asserts no authority,
                  # so reporting it is noise on already-correct code rather than
                  # a finding an auditor can act on.
                  authority_names = ("authority", "owner", "admin", "user", "payer", "signer")
                  at_stake = False
                  for raw in nodes.find_by_names("AccountInfo", "UncheckedAccount"):
                      if not raw.access_path.startswith(struct_path + ".fields.named["):
                          continue
                      if raw.parent is None:
                          continue
                      field_path = raw.access_path.split(".ty")[0]
                      # A field pinned by seeds/address is proven by the
                      # framework, not by a signature.
                      pinned = False
                      for pin in nodes.find_macro_attribute_by_names("seeds", "address"):
                          if pin.access_path.startswith(field_path + "."):
                              pinned = True
                              break
                      if pinned:
                          continue
                      if raw.parent.ident in authority_names:
                          at_stake = True
                          break

                  # Or the instruction can change state: a writable account with
                  # nobody signing for it means anyone may call the handler and
                  # mutate it. Checking only for an authority-named field would
                  # miss that, which is the core of this vulnerability class.
                  if not at_stake:
                      for mut_attr in nodes.find_macro_attribute_by_names("mut"):
                          if mut_attr.access_path.startswith(struct_path + "."):
                              at_stake = True
                              break

                  if not at_stake:
                      continue

                  reported.append(struct_path)
                  print(derive_node.to_result())
      except:
          continue
