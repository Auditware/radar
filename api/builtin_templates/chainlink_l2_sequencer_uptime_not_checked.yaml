version: 0.1.0
author: forefy
language: solidity
accent: ""
name: Chainlink L2 Sequencer Uptime Not Checked
description: On L2 networks such as Arbitrum and Optimism, Chainlink price consumers must verify the sequencer uptime feed before trusting latestRoundData, otherwise stale prices can be read while the sequencer is down.
severity: High
certainty: Low
rule: |
  for source, nodes in ast:
    try:
        latest_round_calls = nodes.find_nodes_by_member_names("latestRoundData").exit_on_none()
        # Safe pattern: an L2 sequencer uptime feed is consulted
        if len(nodes.find_nodes_by_names("sequencerUptimeFeed", "sequencerUptimeOracle", "uptimeFeed", "uptimeOracle", "sequencer", "gracePeriod", "GRACE_PERIOD", "SequencerDown")) > 0:
            continue
        for call in latest_round_calls:
            print(call.to_result())
    except:
        continue
