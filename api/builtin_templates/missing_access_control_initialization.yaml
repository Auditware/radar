version: 0.1.1
author: forefy
accent: stylus
name: Missing Access Control in Initialization
description: Initialization functions without proper access control or reinitialization protection allow attackers to reset contract state and take ownership.
severity: High
certainty: Medium
vulnerable_example: https://github.com/Auditware/radar/blob/main/api/tests/mocks/missing_access_control_initialization/bad/lib.rs#L13-L16
rule: |
  for source, nodes in ast:
    try:
      if "erc721.rs" in source or "erc20.rs" in source:
        continue
      funcs = nodes.find_all_functions().exit_on_none()
      for func in funcs:
        if func.ident not in ["initialize", "init", "setup"]:
          continue
        access_path = func.access_path or ""
        if ".impl." not in access_path:
          continue

        # Only initializers that install a privileged address.
        has_address_param = False
        for param in func.find_by_names("Address").nodes:
          if ".fn.inputs" in param.access_path:
            has_address_param = True
        if not has_address_param:
          continue

        # Only initializers that actually write contract storage, i.e. a
        # method call whose receiver chain goes through `self`.
        writes_state = False
        for writer in func.find_by_names("set", "push", "insert", "replace").nodes:
          if not writer.access_path.endswith("method_call"):
            continue
          if writer.find_by_names("self").nodes:
            writes_state = True
        if not writes_state:
          continue

        # A guard is a conditional or assertion that reads contract state:
        # `if self.initialized.get()`, `assert!(!self.initialized.get())`,
        # `match self.owner.get()`. Validating only the parameters
        # (`if owner.is_zero()`) is not reinitialization protection, so the
        # `self` node has to sit inside the condition itself.
        has_state_guard = False
        for state in func.find_by_names("self").nodes:
          guard_path = state.access_path
          if ".if.cond" in guard_path:
            has_state_guard = True
          if ".while.cond" in guard_path:
            has_state_guard = True
          if ".match.expr" in guard_path:
            has_state_guard = True
          if ".macro.tokens" in guard_path:
            has_state_guard = True

        # Caller authorization: the function inspects msg::sender, or defers
        # to a named ownership helper.
        checks_caller = False
        if func.find_by_names("msg").nodes and func.find_by_names("sender").nodes:
          checks_caller = True
        if func.find_by_names("only_owner", "require_owner", "assert_owner", "check_owner", "ensure_owner").nodes:
          checks_caller = True

        if not has_state_guard and not checks_caller:
          print(func.to_result())
    except:
      continue
