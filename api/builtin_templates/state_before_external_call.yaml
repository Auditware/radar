version: 0.1.0
author: forefy
accent: stylus
name: State Updated Before External Call
description: Updating state after external calls can lead to reentrancy vulnerabilities where the called contract can re-enter and exploit inconsistent state.
severity: Low
certainty: Low
vulnerable_example: https://github.com/Auditware/radar/blob/main/api/tests/mocks/state_updated_before_external_call/bad/src/lib.rs#L17-L19
rule: |
  for source, nodes in ast:
    try:
      funcs = nodes.find_all_functions().exit_on_none()
      for func in funcs:
        try:
          access_path = func.access_path or ""
          if ".impl." not in access_path:
            continue

          # func.children are flattened in source order; flag a storage mutation
          # (set/insert) that appears after an external call within the same function.
          seen_external_call = False
          for child in func.children:
            if child.ident == "call":
              seen_external_call = True
            elif seen_external_call and child.ident in ("set", "insert"):
              print(child.to_result())
              break
        except:
          continue
    except:
      continue
