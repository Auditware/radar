version: 0.1.1
author: forefy
accent: anchor
name: Account Data Matching
description: Unpacking account structures without verifying authorization might allow an attacker to view or modify account data unintentionally. Therefore, account unpack operations should be accompanied by appropriate ownership verification.
severity: Low
certainty: Low
vulnerable_example: https://github.com/Auditware/radar/blob/main/api/tests/mocks/account_data_matching/bad/src/lib.rs#L13
rule: |
  for source, nodes in ast:
      for function in nodes.find_all_functions():
          unpack_calls = function.find_chained_calls("unpack")
          if not unpack_calls:
              continue

          # Validated when the unpacked account's stored key (`owner`) is
          # compared against the expected signer. A plain `if authority.key !=
          # token.owner` guard counts as much as a `require!` - the previous
          # rule only recognised `require!`, so it false-positived on the
          # if-guarded form.
          owner_comparison = function.find_comparison_involving("owner").nodes
          require_with_owner = (
              function.find_by_names("require", "require_keys_eq", "require_eq").nodes
              and function.find_member_accesses("owner").nodes
          )

          if owner_comparison or require_with_owner:
              continue

          for unpack_call in unpack_calls:
              print(unpack_call.to_result())
