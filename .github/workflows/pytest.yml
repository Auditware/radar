name: Run Pytest

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Fast suite: unit tests, sandbox-security tests, suppression, field-order,
  # and the fixture-based accuracy tests for any committed fixtures. No native
  # toolchain required.
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.12
    defaults:
      run:
        working-directory: api/
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-root
      - name: Install solc (Solidity mock fixtures)
        run: poetry run solc-select install 0.8.20 && poetry run solc-select use 0.8.20
      - name: Generate Solidity mock AST fixtures
        # tests/mocks/**/ast.json is gitignored, so without this the accuracy
        # suite collects nothing and passes silently. This job has solc but no
        # rust_syn, so it generates only what it can and says so: the previous
        # `|| true` hid the Rust failures, and a Rust accuracy test that is
        # never collected does not report as a skip - the job just goes green
        # with less in it. The Rust half runs in `template-gate`, which has the
        # parser, and `test_every_rust_mock_has_a_generated_fixture` fails there
        # if it ever stops being generated.
        run: poetry run python scripts/generate_fixtures.py --only solidity
      - name: Run pytest
        run: poetry run pytest -m "not active_runtime"

  # Controller reporting / exit-code / baseline logic. The tests import only the
  # controller helpers plus pytest (no runtime deps), so install pytest directly
  # and skip the poetry env to keep this independent of controller/poetry.lock.
  controller-tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.12
    defaults:
      run:
        working-directory: controller/
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest
        run: pip install pytest
      - name: Run pytest
        run: pytest -q

  # Template accuracy gate: parses Rust live via rust_syn, so it builds the
  # native extension first. Runs the span-agnostic bad/good scoping gate over
  # every Anchor template (see api/tests/test_scoping.py).
  template-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build rust_syn extension
        working-directory: api/rust_syn_wrapper
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: cargo build --release
      - name: Install the extension where ast.py expects it
        run: |
          sudo mkdir -p /api/utils
          sudo cp api/rust_syn_wrapper/target/release/librust_syn.so /api/utils/rust_syn.so
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        working-directory: api/
        run: poetry install --no-root
      - name: Generate mock AST fixtures
        # This is the job with the Rust parser, so it is the job that owes the
        # suite its Rust fixtures. No `|| true`: a fixture that cannot be built
        # is a failure, not a quieter test run.
        working-directory: api/
        run: poetry run python scripts/generate_fixtures.py

      - name: Run template scoping gate
        working-directory: api/
        run: poetry run pytest tests/test_scoping.py -q

      - name: Run the full accuracy suite
        # Rust accuracy tests need the generated fixtures, so this is the only
        # job where they are collected at all. Running them here is what makes
        # the `|| true` removal above meaningful.
        working-directory: api/
        run: poetry run pytest tests/test_templates.py -q

      - name: Run rule sweep (no rule may raise on any mock variant)
        # Each rule against every mock, not just its own. Narrowing the bare
        # `except:` to RuleSkip means a rule's own bug now propagates instead of
        # being swallowed; this is what notices when one does.
        working-directory: api/
        run: poetry run pytest tests/test_rule_sweep.py -q

      - name: Run class-example gate
        # Independent examples per vulnerability class, several shapes each,
        # written from the class definition rather than from a corpus case. A
        # new rule has to satisfy these before the held-out corpus is spent on
        # it - otherwise the only labelled instance is the one it was tuned on.
        working-directory: api/
        run: poetry run pytest tests/test_class_examples.py -q

      - name: Run cross-file gate
        # The only rules that walk every source before deciding. 250 of the 254
        # mock variants hold one file, so without this their second pass - which
        # is the whole rule - is never exercised.
        working-directory: api/
        run: poetry run pytest tests/test_cross_file.py -q

      - name: Run detection-regression gate
        working-directory: api/
        run: poetry run pytest tests/test_detection_fixtures.py -q

      - name: Run no-false-positive gate
        # Mirror of the detection gate for precision: rules must stay silent on
        # the fixed/safe patterns that issue #32 measured as noise.
        working-directory: api/
        run: poetry run pytest tests/test_noise_fixtures.py -q

      - name: Run span-accuracy gate
        working-directory: api/
        run: poetry run pytest tests/test_span_accuracy.py -q
